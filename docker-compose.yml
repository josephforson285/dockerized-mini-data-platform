---
name: mini-data-platform

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 5s
  retries: 12

# `airflow jobs check` takes ~5s; a 5s timeout passes locally by luck and
# fails on a CI runner.
x-airflow-healthcheck: &airflow-healthcheck
  interval: 15s
  timeout: 30s
  retries: 20
  start_period: 120s

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: ${AIRFLOW_IMAGE:-mini-data-platform/airflow}:${IMAGE_TAG:-local}
  restart: unless-stopped
  # Must stay 50000: Python skips site-packages it does not own.
  user: "${AIRFLOW_UID}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?}
    # Airflow 3 workers call back here; the default localhost is empty.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Must be identical across services or tasks fail "Invalid auth token".
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY:?}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    # Credentials as config, not clicked into a UI.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER}:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:?}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?}
    # Consumed by mini_platform, over the internal network.
    POSTGRES_HOST: postgres
    POSTGRES_USER: ${POSTGRES_USER:?}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    POSTGRES_DB: ${POSTGRES_DB:?}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    MINIO_BUCKET: ${MINIO_BUCKET:?}
    MINIO_REGION: ${MINIO_REGION:?}
  networks: [platform]
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
    - airflow-auth:/opt/airflow/auth
  depends_on:
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      AIRFLOW_DB: ${AIRFLOW_DB:?}
      METABASE_DB: ${METABASE_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    ports:
      - "${POSTGRES_PORT}:5432"
    networks: [platform]
    healthcheck:
      # $$ defers expansion to the container shell.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 10s
      <<: *healthcheck-defaults

  # quay.io, not Docker Hub, which no longer serves this image.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      start_period: 5s
      <<: *healthcheck-defaults

  # One-shot; downstream waits on service_completed_successfully.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BUCKET: ${MINIO_BUCKET:?}
    networks: [platform]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        echo "bucket ready: $$MINIO_BUCKET"

  airflow-init:
    <<: *airflow-common
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        airflow db migrate
        mkdir -p /opt/airflow/auth
        python -c "import json, os; \
          open(os.environ['AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE'], 'w').write( \
          json.dumps({os.environ['AIRFLOW_ADMIN_USER']: os.environ['AIRFLOW_ADMIN_PASSWORD']}))"
        echo "airflow initialised"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT}:8080"
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/monitor/health || exit 1"]
      start_period: 90s
      <<: *healthcheck-defaults

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local || exit 1"]
      <<: *airflow-healthcheck

  # Airflow 3 parses DAGs in its own process, separate from the scheduler.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local || exit 1"]
      <<: *airflow-healthcheck

  # State in Postgres: the default embedded H2 is lost on recreate.
  metabase:
    image: metabase/metabase:v0.63.17.2
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${METABASE_DB:?}
      MB_DB_USER: ${POSTGRES_USER:?}
      MB_DB_PASS: ${POSTGRES_PASSWORD:?}
      MB_SITE_NAME: ${METABASE_SITE_NAME:-Mini Data Platform}
      MB_ANON_TRACKING_ENABLED: "false"
      # Metabase recreates demo content on every boot.
      MB_LOAD_SAMPLE_CONTENT: "false"
    ports:
      - "${METABASE_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      # First-boot migrations are slow; fail slow rather than flap.
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 24

networks:
  # Explicit bridge; services resolve each other by name.
  platform:
    driver: bridge

volumes:
  pgdata:
  miniodata:
  airflow-logs:
  airflow-auth:
